<div class="fixed inset-0 bg-gray-500 bg-opacity-50 flex items-center justify-center z-50">
  <div class="bg-white dark:bg-blue-950 rounded-lg shadow-xl w-full max-w-md p-6">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-semibold text-gray-900 dark:text-white">Nova Tarefa</h2>
      <button
        (click)="todoCreated.emit(null)"
        class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200"
      >
        <i class="fas fa-times text-xl"></i>
      </button>
    </div>

    <form [formGroup]="todoForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label for="title" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
          Título
        </label>
        <input
          type="text"
          id="title"
          formControlName="title"
          class="w-full px-3 py-2 border border-gray-300 dark:border-gray-700 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-blue-900 dark:text-white"
          placeholder="Digite o título da tarefa"
        />
        <div *ngIf="todoForm.get('title')?.invalid && todoForm.get('title')?.touched" class="text-red-500 text-sm mt-1">
          O título deve ter pelo menos 3 caracteres
        </div>
      </div>

      <div>
        <label for="description" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
          Descrição
        </label>
        <textarea
          id="description"
          formControlName="description"
          rows="3"
          class="w-full px-3 py-2 border border-gray-300 dark:border-gray-700 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-blue-900 dark:text-white"
          placeholder="Digite a descrição da tarefa"
        ></textarea>
        <div *ngIf="todoForm.get('description')?.invalid && todoForm.get('description')?.touched" class="text-red-500 text-sm mt-1">
          A descrição deve ter pelo menos 5 caracteres
        </div>
      </div>

      <div>
        <label for="priority" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
          Prioridade
        </label>
        <select
          id="priority"
          formControlName="priority"
          class="w-full px-3 py-2 border border-gray-300 dark:border-gray-700 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-blue-900 dark:text-white"
        >
          <option value="low">Baixa</option>
          <option value="medium">Média</option>
          <option value="high">Alta</option>
        </select>
      </div>

      <div>
        <label for="dueDate" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
          Data de Vencimento
        </label>
        <input
          type="date"
          id="dueDate"
          formControlName="dueDate"
          class="w-full px-3 py-2 border border-gray-300 dark:border-gray-700 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-blue-900 dark:text-white"
        />
        <div *ngIf="todoForm.get('dueDate')?.invalid && todoForm.get('dueDate')?.touched" class="text-red-500 text-sm mt-1">
          Por favor, selecione uma data de vencimento
        </div>
      </div>

      <div class="flex justify-end gap-3">
        <button
          type="button"
          (click)="todoCreated.emit(null)"
          class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-blue-900 rounded-md hover:bg-gray-200 dark:hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500"
        >
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="todoForm.invalid"
          class="px-4 py-2 text-sm font-medium text-white bg-blue-600 dark:bg-blue-700 rounded-md hover:bg-blue-700 dark:hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Criar Tarefa
        </button>
      </div>
    </form>
  </div>
</div>
