<div class="bg-white dark:bg-blue-950 rounded-lg shadow-sm">
  <div class="overflow-x-auto">
    <table class="min-w-full bg-white dark:bg-gray-800 rounded-lg overflow-hidden">
      <thead class="bg-gray-50 dark:bg-gray-700">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Status</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Título</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Descrição</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Prioridade</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Ações</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-200 dark:divide-gray-600">
        <tr *ngFor="let todo of todos" class="hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors duration-200">
          <td class="px-6 py-4">
            <div class="flex items-center">
              <button (click)="toggleCompleted(todo)" class="text-gray-400 hover:text-green-500 dark:hover:text-green-400">
               
              </button>
            </div>
          </td>
          <td class="px-6 py-4">
            <div class="flex items-center">
              <span [class.line-through]="todo.completed" class="text-sm font-medium text-gray-900 dark:text-gray-100">
                {{ todo.title }}
              </span>
             
            </div>
          </td>
          <td class="px-6 py-4">
            <span class="text-sm text-gray-500 dark:text-gray-400">{{ todo.description }}</span>
          </td>
          <td class="px-6 py-4">
            <span [class]="getPriorityClass(todo.priority)" class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full">
              {{ todo.priority }}
            </span>
          </td>
          <td class="px-6 py-4">
            <div class="flex space-x-3">
              <button (click)="editTodo(todo)" class="text-indigo-600 hover:text-indigo-900 dark:text-indigo-400 dark:hover:text-indigo-300">
                Pencil
              </button>
              <button (click)="deleteTodo(todo)" class="text-red-600 hover:text-red-900 dark:text-red-400 dark:hover:text-red-300">
                Trash
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Modal de opções -->
  <div *ngIf="showOptionsModal" 
       class="fixed z-50 bg-white dark:bg-gray-800 shadow-lg rounded-lg p-4"
       [style.left.px]="modalPosition.x"
       [style.top.px]="modalPosition.y">
    <div class="flex flex-col space-y-2">
      <button (click)="onEdit()" class="flex items-center space-x-2 text-indigo-600 hover:text-indigo-900 dark:text-indigo-400 dark:hover:text-indigo-300">
        Pencil
        <span>Editar</span>
      </button>
      <button (click)="toggleImportant()" class="flex items-center space-x-2 text-yellow-600 hover:text-yellow-900 dark:text-yellow-400 dark:hover:text-yellow-300">
        Star
        <span>{{ selectedTodo?.important ? 'Remover importância' : 'Marcar como importante' }}</span>
      </button>
      <button (click)="onDelete()" class="flex items-center space-x-2 text-red-600 hover:text-red-900 dark:text-red-400 dark:hover:text-red-300">
        Trash
        <span>Excluir</span>
      </button>
    </div>
  </div>

  <!-- Overlay para fechar o modal -->
  <div *ngIf="showOptionsModal" 
       class="fixed inset-0 z-40"
       (click)="closeOptionsModal()">
  </div>
</div>
